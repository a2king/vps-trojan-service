<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Blackwood Pictures</title>
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      background: #0b0b0b;
      color: #f2f2f0;
      font-family: "Helvetica Neue", Helvetica, Arial, sans-serif;
    }
    header {
      display: flex;
      justify-content: space-between;
      padding: 22px 5vw;
      font-size: 12px;
      letter-spacing: 0.16em;
      text-transform: uppercase;
    }
    a { color: inherit; text-decoration: none; }
    .hero {
      min-height: 62vh;
      display: flex;
      align-items: flex-end;
      padding: 0 5vw 48px;
      background:
        linear-gradient(180deg, transparent 20%, #0b0b0b 100%),
        radial-gradient(1200px 480px at 70% 20%, #3a3a38 0%, #0b0b0b 70%);
    }
    h1 { font-size: clamp(2.8rem, 8vw, 6.4rem); font-weight: 500; letter-spacing: -0.05em; margin: 0; line-height: 0.9; }
    .grid { display: grid; grid-template-columns: 1.4fr 1fr 1fr; gap: 8px; padding: 8px 5vw 64px; }
    .tile { min-height: 180px; background: #1a1a18; padding: 18px; display: flex; align-items: flex-end; font-size: 13px; letter-spacing: 0.04em; }
    .tile:nth-child(1) { background: #24221c; min-height: 240px; }
    .tile:nth-child(2) { background: #161818; }
    footer { padding: 0 5vw 40px; color: #8a8a84; font-size: 12px; letter-spacing: 0.08em; }
    @media (max-width: 800px) {
      .grid { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>
  <header>
    <div>Blackwood Pictures</div>
    <a href="mailto:book@blackwood-pictures.example">Booking</a>
  </header>
  <section class="hero">
    <h1>Still / motion.</h1>
  </section>
  <section class="grid">
    <div class="tile">Portrait — Oslo, 2025</div>
    <div class="tile">Stage light</div>
    <div class="tile">Archive B</div>
  </section>
  <footer>Available for editorial and small commercial work. No stock library.</footer>
</body>
</html>
